name: Test baseline

on:
  pull_request:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  unit-and-contract:
    runs-on: windows-latest
    strategy:
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
